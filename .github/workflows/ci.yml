name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check packed ESLint consumers
        run: node tests/consumer-compat.mjs
      - name: Collect coverage
        if: matrix.node == 24
        run: pnpm test:coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: error
  macos-check:
    name: macOS / Node ${{ matrix.node }}
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack React plugin
        run: pnpm --filter @kingsguard/eslint-plugin-sentinel-react pack
  check-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack React plugin
        run: pnpm --filter @kingsguard/eslint-plugin-sentinel-react pack --pack-destination $env:RUNNER_TEMP
